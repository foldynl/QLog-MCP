name: AppImage

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .

  appimage:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Build ${{ matrix.architecture }} AppImage
        run: packaging/appimage/build-appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: qlog-mcp-appimage-${{ matrix.architecture }}
          path: |
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: appimage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: qlog-mcp-appimage-*
          path: dist
          merge-multiple: true
      - name: Create release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          previous_tag=$(
            git describe --tags --abbrev=0 \
              --match 'v[0-9]*.[0-9]*.[0-9]*' "${TAG}^" 2>/dev/null || true
          )
          if [[ -n "${previous_tag}" ]]; then
            range="${previous_tag}..${TAG}"
          else
            range="${TAG}"
          fi

          {
            echo "## Changes"
            echo
            git log --format='- %s (`%h`)' "${range}"
          } >release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            dist/*.AppImage \
            dist/*.sha256 \
            --verify-tag \
            --title "QLog MCP ${TAG#v}" \
            --notes-file release-notes.md
