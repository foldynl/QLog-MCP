[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qlog-mcp"
dynamic = ["version"]
description = "MCP server for QLog amateur radio logging software"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21,<1",
    "fastmcp>=4.0,<5",
    "pydantic>=2.11,<3",
]

[project.scripts]
qlog-mcp = "qlog_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qlog_mcp"]

[tool.hatch.version]
source = "code"
path = "versioning.py"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
